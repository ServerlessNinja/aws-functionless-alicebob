mutation SentTelegram {
  sentTelegram(
    telegraph: { 
      source: Telegraph, 
      detailType: ComposeTelegram, 
      detail: { 
        from: "Bob", 
        to: "Alice", 
        message: "Hello darling. Coming to Paris next week. I cannot wait for our dinner date!", 
        category: PERSONAL, 
        priority: URGENT,
        translate: FR
      }
    }
  ) {
    EventId
  }
}