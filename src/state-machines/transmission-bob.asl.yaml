Comment: Transmission state machine (Bob)
StartAt: Validate Fields
TimeoutSeconds: 120
QueryLanguage: JSONata
States:
  Validate Fields:
    Type: Pass
    Next: Convert Telegram
    Assign:
      from_name: "{% $states.input.from %}"
      to_name: "{% $states.input.to %}"
      message: "{% $states.input.message %}"
      category: "{% $states.input.category %}"
      language: "{% $states.input.translate %}"
  Convert Telegram:
    Type: Pass
    Next: Check Priority
    Assign:
      word_count: "{% $count($split($message, ' ')) %}"
      message: "{% $uppercase($replace($message, '.', ' STOP')) %}"
      language: "{% $lowercase($language) %}"
  Check Priority:
    Type: Choice
    Default: Standard Counter
    Choices:
      - Next: Express Counter
        Condition: '{% ($states.input.priority) = ("URGENT") %}'
  Express Counter:
    Type: Pass
    Next: Search Address Book
    Assign:
      service_level: EXPRESS
      price_per_word: 0.2
      translation: 1
      currency: £
  Standard Counter:
    Type: Wait
    Seconds: 10
    Next: Search Address Book
    Assign:
      service_level: STANDARD
      price_per_word: 0.1
      translation: 0.5
      currency: £
  Search Address Book:
    Comment: Get configuration stored in Parameter Store
    Type: Task
    Next: Translate Message
    Resource: arn:aws:states:::aws-sdk:ssm:getParameters
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Fail
    Assign:
      from_address: "{% $states.result.Parameters[0].Value %}"
      to_address: "{% $states.result.Parameters[1].Value %}"
    Arguments:
      Names:
        - "{% '/AddressBook/' & $from_name & '/Office' %}"
        - "{% '/AddressBook/' & $to_name & '/Office' %}"
  Translate Message:
    Type: Task
    Arguments:
      SourceLanguageCode: en
      TargetLanguageCode: "{% $language %}"
      Text: "{% $message %}"
      Settings:
        Formality: INFORMAL
    Resource: arn:aws:states:::aws-sdk:translate:translateText
    Next: Accept Telegram
    Retry:
      - ErrorEquals:
          - States.ALL
        BackoffRate: 2
        IntervalSeconds: 1
        MaxAttempts: 3
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Fail
    Assign:
      translated: "{% $states.result.TranslatedText %}"
  Accept Telegram:
    Comment: Add telegram ID and status to the document
    Type: Pass
    Next: Save in Telegram Archive
    Assign:
      document_type: TELEGRAM
      status: TRANSMITTED
      telegram_id: "{% $uuid() %}"
      created_at: "{% $states.context.State.EnteredTime %}"
      charges: "{% $currency & $string(($price_per_word * $word_count) +
        ($translation)) %}"
      payment: CASH
  Fail:
    Type: Fail
    Error: TransmissionError
    Comment: Transmission failed
    Cause: "{% $states.context.State.Name %}"
  Save in Telegram Archive:
    Comment: Add or update records in DynamoDB table
    Type: Task
    Resource: arn:aws:states:::dynamodb:putItem
    Retry:
      - ErrorEquals:
          - States.ALL
        BackoffRate: 2
        IntervalSeconds: 1
        MaxAttempts: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Fail
    TimeoutSeconds: 10
    HeartbeatSeconds: 3
    Next: Transmit Telegram
    Arguments:
      TableName: ${DYNAMODB_TABLE_NAME}
      Item:
        telegram_id:
          S: "{% $telegram_id %}"
        category:
          S: "{% $category %}"
        delivery_status:
          S: "{% $status %}"
        from:
          M:
            name:
              S: "{% $from_name %}"
            address:
              S: "{% $from_address %}"
        to:
          M:
            name:
              S: "{% $to_name %}"
            address:
              S: "{% $to_address %}"
        message:
          M:
            original:
              S: "{% $message %}"
            translated:
              S: "{% $translated %}"
        cost:
          M:
            serviceLevel:
              S: "{% $service_level %}"
            charges:
              S: "{% $charges %}"
            payment:
              S: "{% $payment %}"
        created_at:
          S: "{% $created_at %}"
  Transmit Telegram:
    Comment: Send an event to event bus in remote region
    Type: Task
    Resource: arn:aws:states:::events:putEvents
    Retry:
      - ErrorEquals:
          - States.ALL
        BackoffRate: 2
        IntervalSeconds: 1
        MaxAttempts: 2
    TimeoutSeconds: 10
    HeartbeatSeconds: 3
    Next: Success
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Fail
    Arguments:
      Entries:
        - EventBusName: ${EVENT_BUS_NAME}
          Source: Telegraph
          DetailType: IncomingTelegram
          Detail:
            document_type: "{% $document_type %}"
            service_level: "{% $service_level %}"
            telegram_id: "{% $telegram_id %}"
            category: "{% $category %}"
            status: "{% $status %}"
            sent_at: "{% $states.context.State.EnteredTime %}"
            from:
              name: "{% $from_name %}"
              address: "{% $from_address %}"
            to:
              name: "{% $to_name %}"
              address: "{% $to_address %}"
            message:
              original: "{% $message %}"
              translated: "{% $translated %}"
              language: "{% $language %}"
    Assign:
      event_id: "{% $states.result.Entries[0].EventId %}"
  Success:
    Type: Succeed
    Output:
      telegram_id: "{% $telegram_id %}"
      event_id: "{% $event_id %}"
    Comment: Transmission successfull
