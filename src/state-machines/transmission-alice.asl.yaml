Comment: Transmission state machine (Alice)
StartAt: Open Telegram
TimeoutSeconds: 120
QueryLanguage: JSONata
States:
  Open Telegram:
    Type: Wait
    Seconds: 5
    Next: Check Category
    Assign:
      document_type: "{% $states.input.document_type %}"
      service_level: "{% $states.input.service_level %}"
      telegram_id: "{% $states.input.telegram_id %}"
      category: "{% $states.input.category %}"
      status: RECEIVED
      received_at: "{% $states.context.State.EnteredTime %}"
    Comment: Wait state to slow down execution
  Check Category:
    Type: Choice
    Choices:
      - Next: Personal Message
        Condition: '{% (($category) = ("PERSONAL")) %}'
    Default: Other Business
    Comment: Check category of the telegram personal vs business
  Personal Message:
    Type: Pass
    Next: Store in Telegram Archive
    Assign:
      from_name: "{% $states.input.from.name %}"
      from_address: "{% $states.input.from.address %}"
      to_name: "{% $states.input.to.name %}"
      to_address: "{% $states.input.to.address %}"
      message: "{% $states.input.message.translated %}"
      updated_at: "{% $states.context.State.EnteredTime %}"
      status: DELIVERED
      reaction: 😍
  Store in Telegram Archive:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    Arguments:
      TableName: ${DYNAMODB_TABLE_NAME}
      Key:
        telegram_id:
          S: "{% $telegram_id %}"
      UpdateExpression: SET delivery_status = :delivery_status, updated_at =
        :updated_at, reaction = :reaction
      ExpressionAttributeValues:
        :updated_at:
          S: "{% $updated_at %}"
        :delivery_status:
          S: "{% $status %}"
        :reaction:
          S: "{% $reaction %}"
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Fail
    Next: Update Personal Diary
    Comment: Update DynamoDB item
  Update Personal Diary:
    Type: Task
    Arguments:
      SecretId: ${SECRET_ARN}
      SecretString: '{% $string({ "Who": $from_name, "When": $received_at, "What":
        $message, "Note": $reaction }, true) %}'
    Resource: arn:aws:states:::aws-sdk:secretsmanager:putSecretValue
    Next: Notify Telegraph
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Fail
    Comment: Update Secret Manager secret
  Notify Telegraph:
    Type: Task
    Resource: arn:aws:states:::events:putEvents
    Arguments:
      Entries:
        - EventBusName: ${EVENT_BUS_NAME}
          Source: Telegraph
          DetailType: TelegramDelivered
          Detail:
            document_type: "{% $document_type %}"
            service_level: "{% $service_level %}"
            telegram_id: "{% $telegram_id %}"
            category: "{% $category %}"
            status: "{% $status %}"
            received_at: "{% $received_at %}"
            from:
              name: "{% $from_name %}"
              address: "{% $from_address %}"
            to:
              name: "{% $to_name %}"
              address: "{% $to_address %}"
            message:
              translated: "{% $message %}"
            reaction: "{% $reaction %}"
    Next: Success
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Fail
    Assign:
      event_id: "{% $states.result.Entries[0].EventId %}"
    Comment: Send event to local event bus for logging
  Success:
    Type: Succeed
    Output:
      telegram_id: "{% $telegram_id %}"
      event_id: "{% $event_id %}"
    Comment: Transmission successfull
  Fail:
    Type: Fail
    Error: TransmissionFailed
    Cause: "{% $states.context.State.Name %}"
  Other Business:
    Type: Pass
    Next: Postpone
    Assign:
      reaction: 🥶
  Postpone:
    Type: Wait
    Seconds: 10
    Next: Pending Tray
    Comment: Postpone telegram
  Pending Tray:
    Type: Task
    Resource: arn:aws:states:::sqs:sendMessage
    Arguments:
      QueueUrl: ${QUEUE_URL}
      MessageBody: "{% $states.input %}"
      MessageGroupId: "{% $category %}"
    End: true
    Comment: Store telegram in SQS queue for further processing
